name: DocScanner
options:
  bundleIdPrefix: com.example
configs:
  Debug: debug
  Release: release
targets:
  DocScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "DocScanner"
        NSCameraUsageDescription: "DocScanner needs camera access to scan documents."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.docscanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  DocScanner:
    build:
      targets:
        DocScanner: all
    run:
      config: Debug
    archive:
      config: Release
